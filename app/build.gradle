apply plugin: 'com.android.application'

android {
    namespace 'com.blackmask.jarvis'
    compileSdk 34

    defaultConfig {
        applicationId 'com.blackmask.jarvis'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


// No third-party libraries: plain Java + Android SDK only.
// (The QR scanner's CameraX + ML Kit were removed in v4.9.2 - they made the APK 14MB.)
dependencies {
}
