<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber WhatsApp Bot - Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            background-color: #0b0f0c;
            color: #00ff66;
            font-family: 'Share Tech Mono', monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px #00ff66;
        }
        .container {
            max-width: 450px;
            margin: auto;
            background: #111a13;
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
            padding: 20px;
            border-radius: 10px;
        }
        #qr-box {
            margin: 20px 0;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #qr-code {
            max-width: 100%;
            border: 3px solid #00ff66;
            box-shadow: 0 0 15px #00ff66;
            border-radius: 8px;
        }
        .input-group {
            margin: 20px 0;
        }
        input {
            width: 80%;
            padding: 10px;
            background: #0b0f0c;
            border: 1px solid #00ff66;
            color: #00ff66;
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            text-align: center;
            border-radius: 5px;
            outline: none;
        }
        button {
            background: #00ff66;
            color: #0b0f0c;
            border: none;
            padding: 10px 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px #00ff66;
        }
        button:hover {
            background: #00cc52;
        }
        #pairing-display {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #fff;
            background: #1a2e1e;
            padding: 10px;
            border: 1px dashed #00ff66;
            margin-top: 10px;
        }
        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #00aa44;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CYBER WHATSAPP BOT</h1>
        <p id="status">Connecting to server...</p>

        <!-- QR Code Section -->
        <div id="qr-box">
            <img id="qr-code" style="display:none;" alt="WhatsApp QR Code">
        </div>

        <hr style="border-color: #00ff66; opacity: 0.3;">

        <!-- Pairing Code Section -->
        <div class="input-group">
            <p>Or Connect via Phone Number:</p>
            <input type="text" id="phone-input" placeholder="e.g. 88017xxxxxxxx">
            <br>
            <button onclick="requestPairingCode()">Get Pairing Code</button>
            <div id="pairing-display" style="display:none;"></div>
        </div>

        <div class="footer">
            Developer: Arif
        </div>
    </div>

    <script>
        const socket = io();

        const statusEl = document.getElementById('status');
        const qrImg = document.getElementById('qr-code');
        const phoneInput = document.getElementById('phone-input');
        const pairingDisplay = document.getElementById('pairing-display');

        socket.ons('status', (msg) => {
            statusEl.innerText = msg;
        });

        socket.on('qr', (url) => {
            if (url) {
                qrImg.src = url;
                qrImg.style.display = 'block';
            } else {
                qrImg.style.display = 'none';
            }
        });

        socket.on('pairingCode', (code) => {
            if (code === 'CONNECTED') {
                pairingDisplay.innerText = 'SUCCESSFULLY CONNECTED!';
                pairingDisplay.style.display = 'block';
                qrImg.style.display = 'none';
            } else {
                pairingDisplay.innerText = code;
                pairingDisplay.style.display = 'block';
            }
        });

        function requestPairingCode() {
            const phone = phoneInput.value.trim();
            if (!phone) {
                alert('Please enter your WhatsApp phone number with country code!');
                return;
            }
            statusEl.innerText = 'Requesting pairing code...';
            socket.emit('request-pairing-code', phone);
        }
    </script>

</body>
    </html>
