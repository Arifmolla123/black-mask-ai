<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp QR Bot Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #38bdf8;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 20px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
        }
        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .qr-box {
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
        }
        #qrcode {
            width: 220px;
            height: 220px;
            display: block;
        }
        #status {
            font-size: 15px;
            font-weight: bold;
            color: #38bdf8;
            padding: 10px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            border: 1px dashed rgba(56, 189, 248, 0.4);
        }
        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #64748b;
            letter-spacing: 0.5px;
        }
        .footer span {
            color: #38bdf8;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>WhatsApp QR Bot</h2>
            <p>Scan the QR code below using your WhatsApp linked devices to connect your bot instantly.</p>
            
            <div>
                <div class="qr-box">
                    <img id="qrcode" src="" alt="Waiting for QR Code..." style="display:none;">
                </div>
            </div>

            <div id="status">Initializing connection server...</div>

            <div class="footer">
                Developer: <span>Arif</span>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const qrImg = document.getElementById('qrcode');
        const statusDiv = document.getElementById('status');

        socket.on('status', (msg) => {
            statusDiv.innerText = msg;
        });

        socket.on('qr', (src) => {
            if (src) {
                qrImg.src = src;
                qrImg.style.display = 'block';
            } else {
                qrImg.style.display = 'none';
            }
        });
    </script>
</body>
    </html>
