<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber WhatsApp Bot - Pairing</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            background-color: #0b0f0c;
            color: #00ff66;
            font-family: 'Share Tech Mono', monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px #00ff66;
        }
        .container {
            max-width: 450px;
            margin: 40px auto;
            background: #111a13;
            border: 2px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
            padding: 30px;
            border-radius: 10px;
        }
        .input-group {
            margin: 20px 0;
        }
        input {
            width: 85%;
            padding: 12px;
            background: #0b0f0c;
            border: 1px solid #00ff66;
            color: #00ff66;
            font-family: 'Share Tech Mono', monospace;
            font-size: 18px;
            text-align: center;
            border-radius: 5px;
            outline: none;
        }
        button {
            background: #00ff66;
            color: #0b0f0c;
            border: none;
            padding: 12px 25px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            border-radius: 5px;
            box-shadow: 0 0 10px #00ff66;
            font-size: 16px;
        }
        button:hover {
            background: #00cc52;
        }
        #pairing-display {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #fff;
            background: #1a2e1e;
            padding: 15px;
            border: 1px dashed #00ff66;
            margin-top: 20px;
            border-radius: 5px;
        }
        #status {
            margin: 15px 0;
            font-size: 16px;
            color: #00ffaa;
        }
        .footer {
            margin-top: 40px;
            font-size: 14px;
            color: #00aa44;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CYBER WHATSAPP BOT</h1>
        <p id="status">Connecting...</p>

        <!-- Pairing Code Section Only -->
        <div class="input-group">
            <p>Enter WhatsApp Number with Country Code:</p>
            <input type="text" id="phone-input" placeholder="e.g. 917865875762">
            <br>
            <button onclick="requestPairingCode()">Get Pairing Code</button>
            <div id="pairing-display" style="display:none;"></div>
        </div>

        <div class="footer">
            Developer: Arif
        </div>
    </div>

    <script>
        const socket = io();

        const statusEl = document.getElementById('status');
        const phoneInput = document.getElementById('phone-input');
        const pairingDisplay = document.getElementById('pairing-display');

        socket.on('status', (msg) => {
            statusEl.innerText = msg;
        });

        socket.on('pairingCode', (code) => {
            if (code === 'CONNECTED') {
                pairingDisplay.innerText = 'SUCCESSFULLY CONNECTED!';
                pairingDisplay.style.display = 'block';
            } else {
                pairingDisplay.innerText = code;
                pairingDisplay.style.display = 'block';
            }
        });

        function requestPairingCode() {
            const phone = phoneInput.value.trim();
            if (!phone) {
                alert('Please enter your phone number!');
                return;
            }
            statusEl.innerText = 'Requesting pairing code...';
            socket.emit('request-pairing-code', phone);
        }
    </script>

</body>
</html>
